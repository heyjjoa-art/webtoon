<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>그림판 - 낙서장</title>
  <link rel="stylesheet" href="css/tokens.css?v=202609031711" />
  <link rel="stylesheet" href="css/base.css?v=202609031711" />
  <link rel="stylesheet" href="css/paint.css?v=202609031711" />
</head>
<body>
  <div id="paintRoot" class="paint-root">
    <div class="paint-topbar">
      <button class="btn btn-ghost btn-sm" id="paintBackBtn">← 저장하고 돌아가기</button>
      <div class="spacer"></div>
      <button class="btn btn-icon btn-ghost" id="undoBtn" title="되돌리기 (Ctrl+Z)">↩️</button>
      <button class="btn btn-icon btn-ghost" id="redoBtn" title="다시하기 (Ctrl+Shift+Z)">↪️</button>
      <button class="btn btn-ghost btn-sm" id="clearBtn">전체 지우기</button>
      <span id="paintSaveStatus" class="muted" style="font-size:12px;"></span>
    </div>

    <div class="paint-body">
      <div class="paint-toolrail" id="toolRail"></div>

      <div class="paint-canvas-area" id="canvasArea">
        <div class="paint-canvas-stage" id="canvasStage">
          <canvas id="compositeCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
      </div>

      <div class="paint-rightpanel">
        <div class="paint-section" id="brushSection"></div>
        <div class="paint-section" id="colorSection"></div>
        <div class="paint-section" id="layerSection"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=202609031711"></script>
  <script src="js/cloud.js?v=202609031711"></script>
  <script src="js/admin-auth.js?v=202609031711"></script>
  <script src="js/episode-store.js?v=202609031711"></script>
  <script src="js/art-store.js?v=202609031711"></script>
  <script src="js/panel-art-store.js?v=202609031711"></script>
  <script src="js/paint-core.js?v=202609031711"></script>
  <script src="js/paint-brush.js?v=202609031711"></script>
  <script src="js/paint-extras.js?v=202609031711"></script>
  <script src="js/paint-ui.js?v=202609031711"></script>
</body>
</html>
