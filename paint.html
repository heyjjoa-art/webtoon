<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>그림판 - 낙서장</title>
  <link rel="stylesheet" href="css/tokens.css?v=202609111625" />
  <link rel="stylesheet" href="css/base.css?v=202609111625" />
  <link rel="stylesheet" href="css/tool-ui.css?v=202609111625" />
  <link rel="stylesheet" href="css/paint.css?v=202609111625" />
</head>
<body>
  <div id="paintRoot" class="paint-root">
    <div class="paint-topbar">
      <button class="btn btn-ghost btn-sm" id="paintBackBtn">← 저장하고 돌아가기</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="undoBtn" data-tooltip="되돌리기 (Ctrl+Z)"></button>
      <button class="icon-btn" id="redoBtn" data-tooltip="다시하기 (Ctrl+Shift+Z)"></button>
      <button class="icon-btn" id="colorMenuBtn" data-tooltip="색상"><span class="current-color-swatch" id="currentColorSwatch"></span></button>
      <button class="icon-btn" id="layerMenuBtn" data-tooltip="레이어"></button>
      <button class="icon-btn drawer-toggle" id="inspectorToggleBtn" data-tooltip="브러시·색상·레이어"></button>
      <span id="paintSaveStatus" class="muted" style="font-size:12px;"></span>
      <button class="btn btn-ghost btn-sm" id="clearBtn" style="margin-left:auto;">전체 지우기</button>
    </div>

    <div class="paint-body">
      <div class="tool-rail" id="toolRail"></div>

      <div class="paint-canvas-area" id="canvasArea">
        <div class="paint-canvas-stage" id="canvasStage">
          <canvas id="compositeCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
        <div class="paint-zoombar" id="zoomBar"></div>
      </div>

      <div class="drawer-scrim" id="inspectorScrim"></div>
      <div class="inspector is-drawer" id="inspectorPanel">
        <div class="inspector-section" id="brushSection"></div>
        <div class="inspector-section" id="colorSection"></div>
        <div class="inspector-section" id="layerSection"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=202609111625"></script>
  <script src="js/cloud.js?v=202609111625"></script>
  <script src="js/session.js?v=202609111625"></script>
  <script src="js/episode-store.js?v=202609111625"></script>
  <script src="js/art-store.js?v=202609111625"></script>
  <script src="js/panel-art-store.js?v=202609111625"></script>
  <script src="js/brush-preset-store.js?v=202609111625"></script>
  <script src="js/icons.js?v=202609111625"></script>
  <script src="js/paint-core.js?v=202609111625"></script>
  <script src="js/paint-brush.js?v=202609111625"></script>
  <script src="js/paint-extras.js?v=202609111625"></script>
  <script src="js/paint-ui.js?v=202609111625"></script>
</body>
</html>
