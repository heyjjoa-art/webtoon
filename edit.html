<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>컷 편집 - 낙서장</title>
  <link rel="stylesheet" href="css/tokens.css?v=202609041347" />
  <link rel="stylesheet" href="css/base.css?v=202609041347" />
  <link rel="stylesheet" href="css/editor.css?v=202609041347" />
</head>
<body>
  <header class="site-header">
    <a class="header-btn" href="admin.html" id="backLink">← 목록</a>
    <input type="text" id="epTitleInput" class="title-input" placeholder="회차 제목" />
    <div class="spacer"></div>
    <span id="saveStatus" class="muted" style="font-size:12px;"></span>
  </header>

  <div class="editor-toolbar">
    <div class="tb-group">
      <button class="btn btn-ghost btn-sm" id="addPanelBtn">+ 컷</button>
      <select id="presetSelect" class="tb-select">
        <option value="1">1단</option>
        <option value="2col">2단(가로2)</option>
        <option value="3row">3단(세로3)</option>
        <option value="4grid">4컷(격자)</option>
      </select>
    </div>
    <div class="tb-group">
      <button class="btn btn-ghost btn-sm" id="dupBtn" disabled>복제</button>
      <button class="btn btn-ghost btn-sm" id="frontBtn" disabled>맨앞</button>
      <button class="btn btn-ghost btn-sm" id="backBtn" disabled>맨뒤</button>
      <button class="btn btn-danger btn-sm" id="delBtn" disabled>삭제</button>
    </div>
    <div class="tb-group">
      <button class="btn btn-ghost btn-sm" id="addBubbleBtn">💬 말풍선</button>
      <button class="btn btn-ghost btn-sm" id="addNarrationBtn">▭ 나레이션</button>
      <button class="btn btn-ghost btn-sm" id="addSfxBtn">✨ 효과음</button>
    </div>
  </div>

  <div class="editor-wrap">
    <div class="editor-canvas-scroll">
      <div class="editor-canvas" id="editorCanvas">
        <div class="guide-v" id="guideV" hidden></div>
        <div class="guide-h" id="guideH" hidden></div>
      </div>
    </div>
    <div class="side-panel" id="sidePanel">
      <div class="center-empty" style="padding:40px 16px;">컷이나 말풍선을 눌러 속성을 편집하세요.</div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" hidden />

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=202609041347"></script>
  <script src="js/cloud.js?v=202609041347"></script>
  <script src="js/session.js?v=202609041347"></script>
  <script src="js/episode-store.js?v=202609041347"></script>
  <script src="js/panel-art-store.js?v=202609041347"></script>
  <script src="js/editor.js?v=202609041347"></script>
</body>
</html>
