<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>웹툰 관리 - 낙서장</title>
  <link rel="stylesheet" href="css/tokens.css?v=202609071530" />
  <link rel="stylesheet" href="css/base.css?v=202609071530" />
  <link rel="stylesheet" href="css/nav.css?v=202609071530" />
  <link rel="stylesheet" href="css/admin.css?v=202609071530" />
</head>
<body data-page="toon">
  <div id="siteNav"></div>

  <!-- 시리즈를 고르지 않았을 때: 시리즈 목록 관리 화면 -->
  <div class="container" id="seriesListRoot" hidden>
    <div class="admin-list-head">
      <h2>웹툰 시리즈</h2>
      <button class="btn btn-primary btn-sm" id="newSeriesBtn">+ 새 시리즈</button>
    </div>
    <div id="seriesAdminList"></div>
  </div>

  <!-- 시리즈를 골랐을 때: 그 시리즈의 설정 + 회차 관리 화면 -->
  <div class="container" id="episodeAdminRoot" hidden>
    <a class="header-btn" href="admin.html" style="margin:12px 0;display:inline-block;">← 전체 시리즈</a>
    <section class="card admin-section" id="seriesSection"></section>

    <div class="admin-list-head">
      <h2>회차</h2>
      <button class="btn btn-primary btn-sm" id="newEpisodeBtn">+ 새 회차</button>
    </div>
    <div id="episodeAdminList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=202609071530"></script>
  <script src="js/cloud.js?v=202609071530"></script>
  <script src="js/session.js?v=202609071530"></script>
  <script src="js/series-store.js?v=202609071530"></script>
  <script src="js/episode-store.js?v=202609071530"></script>
  <script src="js/panel-art-store.js?v=202609071530"></script>
  <script src="js/profile-store.js?v=202609071530"></script>
  <script src="js/site-nav.js?v=202609071530"></script>
  <script src="js/admin.js?v=202609071530"></script>
</body>
</html>
